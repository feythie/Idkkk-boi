<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE OFFICIAL WEDDING EXPERIENCE</title>
<style>
body {
    background: linear-gradient(135deg, #E6D8FF, #F3E5FF);
    font-family: "Brush Script MT", cursive;
    text-align: center;
    padding-top: 60px;
}h1 { color: #5A2D82; font-size: 32px; }

.question { margin-top: 30px; font-size: 24px; color: #4B1F6F; }

button { background-color: #5A2D82; color: white; border: none; padding: 15px 30px; margin: 10px; font-size: 20px; cursor: pointer; border-radius: 15px; font-family: "Brush Script MT", cursive; transition: transform 0.2s; }

button:hover { transform: scale(1.1); }

#message { margin-top: 30px; font-size: 22px; color: #4B1F6F; }

.hidden { display: none; }

.confetti { position: fixed; top: 0; width: 10px; height: 10px; animation: fall 3s linear infinite; }

@keyframes fall { 0% { transform: translateY(0); } 100% { transform: translateY(100vh); } } </style>

</head>
<body><h1>WELCOME TO THE MOST IMPORTANT WEBSITE OF YOUR LIFE</h1><div id="q1" class="question">
    DO YOU THINK ZEE IS AWESOME?
    <br>
    <button onclick="next('q1','q2')">YES OBVIOUSLY</button>
    <button onclick="nope()">NO</button>
</div><div id="q2" class="question hidden">
    WOULD YOU LIKE FREE SNACKS FOR LIFE?
    <br>
    <button onclick="next('q2','q3')">ABSOLUTELY</button>
    <button onclick="nope()">NO THANKS</button>
</div><div id="q3" class="question hidden">
    DO YOU PROMISE TO LAUGH AT ZEE'S JOKES?
    <br>
    <button onclick="next('q3','q4')">I PROMISE</button>
    <button onclick="nope()">MAYBE</button>
</div><div id="q4" class="question hidden">
    FINAL AND MOST SERIOUS QUESTION...
    <br>
    ZEE WANTS YOUR HAND IN MARRIAGE. WILL YOU ACCEPT?
    <br>
    <button onclick="yesClick()">YES YES YES</button>
    <button onclick="nope()">NO</button>
</div><div id="message"></div><script>
function next(current, nextOne) {
    document.getElementById(current).classList.add('hidden');
    document.getElementById(nextOne).classList.remove('hidden');
}

function nope() {
    document.getElementById("message").innerHTML = "THAT ANSWER HAS BEEN REMOVED FOR BEING INCORRECT";
}

function yesClick() {
    document.getElementById("message").innerHTML = "CONGRATULATIONS YOU ARE OFFICIALLY MARRIED TODAY! THIS IS A BEAUTIFUL MOMENT IN HISTORY WHERE TWO AMAZING PEOPLE HAVE COME TOGETHER IN LOVE AND HAPPINESS. MAY YOUR DAYS BE FILLED WITH LAUGHTER, JOY, AND LOTS OF FUN ADVENTURES FOREVER AND EVER!";
    startConfetti();
}

function startConfetti() {
    for (let i = 0; i < 150; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        confetti.style.backgroundColor = getRandomColor();
        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 5000);
    }
}

function getRandomColor() {
    const colors = ["#5A2D82", "#9B59B6", "#D7BDE2", "#8E44AD", "#C39BD3", "#F5B7B1"];
    return colors[Math.floor(Math.random() * colors.length)];
}
</script></body>
</html>
